<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현동서재 관리자 센터 — 매출 · 상품 · 주문배송 · 문의 · 배너/약관 관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./css/tokens.css?v=20261113l" />
  <link rel="stylesheet" href="./css/admin.css?v=20261113l" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261113" />
  <link rel="alternate icon" href="./favicon.ico?v=20261113" />
</head>
<body>

  <!-- 모바일 드로어 배경 -->

  <div class="admin-shell">
    <!-- 좌측 사이드바 (한의학 상징 아이콘 + 간결한 직관형 메뉴) -->
    <aside class="admin-sidebar" id="adminSidebar" aria-label="관리자 메뉴">
      <div class="admin-sidebar-brand">
        <div class="admin-sidebar-brand-left">
          <img src="./images/logo-mark-light.svg" alt="현동서재 관리자 로고" class="brand-logo-mark admin-brand-logo-mark" width="38" height="38" />
          <div>
            <strong style="display:block; font-family:var(--font-serif); font-size:1.02rem;">현동서재 관리자</strong>
            <span style="font-size:0.72rem; color:#cbc5b8;">한의학 도서 운영센터</span>
          </div>
        </div>
        <button type="button" class="btn btn-sm btn-outline admin-mobile-close-btn" id="btnCloseAdminDrawer" style="min-height:34px; padding:0 10px;">닫기</button>
      </div>

      <div class="admin-nav-scroll">
        <div class="admin-nav-group-label">운영 현황</div>
        <ul class="admin-nav-list">
          <li>
            <button type="button" class="admin-nav-btn is-active" data-admin-sec="dashboard">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 진맥 맥파도 (대시보드) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3.5" width="18" height="17" rx="3.5" />
                    <path d="M6.5 13h2.3l1.7-4.2 2.6 7.4 1.9-3.2h2.5" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>대시보드</strong></span>
              </span>
            </button>
          </li>
        </ul>

        <div class="admin-nav-group-label">도서 · 출고</div>
        <ul class="admin-nav-list">
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="books">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 전통 선장본 한의서 (도서 · 재고) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4.5" y="3" width="15" height="18" rx="2" />
                    <line x1="15.5" y1="3" x2="15.5" y2="21" />
                    <line x1="15.5" y1="6.8" x2="19.5" y2="6.8" />
                    <line x1="15.5" y1="10.8" x2="19.5" y2="10.8" />
                    <line x1="15.5" y1="14.8" x2="19.5" y2="14.8" />
                    <line x1="15.5" y1="18.2" x2="19.5" y2="18.2" />
                    <rect x="7.5" y="6.5" width="3.2" height="7.5" rx="0.6" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>도서 · 재고</strong></span>
              </span>
              <span class="badge badge-brand" id="navBookCount">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="orders">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 전통 보자기 매듭 발송함 (주문 · 발송) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="8.5" width="16" height="12" rx="2.2" />
                    <line x1="12" y1="8.5" x2="12" y2="20.5" />
                    <line x1="4" y1="13.5" x2="20" y2="13.5" />
                    <path d="M12 8.5C10.2 8.5 8 7.2 8 5.4c0-1.2 1-2 2.2-2 1.1 0 1.8 1.2 1.8 3.1Z" />
                    <path d="M12 8.5c1.8 0 4-1.3 4-3.1 0-1.2-1-2-2.2-2-1.1 0-1.8 1.2-1.8 3.1Z" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>주문 · 발송</strong></span>
              </span>
              <span class="badge badge-warning" id="navPendingShipCount">0</span>
            </button>
          </li>
        </ul>

        <div class="admin-nav-group-label">회원 · 소통</div>
        <ul class="admin-nav-list">
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="members">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 한복 동정 깃 독자 (회원 관리) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="7.2" r="3.4" />
                    <path d="M5 20.2c0-3.8 3.1-6.4 7-6.4s7 2.6 7 6.4" />
                    <path d="M9.3 14.3L12 18.2l2.7-3.9" />
                    <line x1="12" y1="18.2" x2="13.6" y2="20.2" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>회원 관리</strong></span>
              </span>
              <span class="badge badge-brand" id="navMemberCount">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="qna">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 세필 붓 · 문답 서찰 (문의 답변) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12.5v3.3a2.2 2.2 0 0 1-2.2 2.2H8.5L4.5 20.5V6.7A2.2 2.2 0 0 1 6.7 4.5h6.8" />
                    <path d="M18.8 3.8l1.4 1.4-5.6 5.6-2.4.8.8-2.4 5.8-5.4Z" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>문의 답변</strong></span>
              </span>
              <span class="badge badge-danger" id="navPendingQnaCount">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="boards">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 전통 두루마리 족자 (공지 · FAQ) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="5.5" x2="20" y2="5.5" />
                    <line x1="4" y1="19.5" x2="20" y2="19.5" />
                    <path d="M9.5 5.5L12 3l2.5 2.5" />
                    <rect x="6.2" y="5.5" width="11.6" height="14" />
                    <line x1="9.2" y1="10" x2="14.8" y2="10" />
                    <line x1="9.2" y1="14" x2="13.5" y2="14" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>공지 · FAQ</strong></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="reviews">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 본초 약초 3엽 · 별 (구매후기) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="11.5" y1="20.5" x2="11.5" y2="12.5" />
                    <path d="M11.5 13c-2.4-2.2-2.4-5.8 0-8 2.4 2.2 2.4 5.8 0 8Z" />
                    <path d="M11.5 16c-3.5-.2-5.8-2.4-6.2-5.2 2.9.2 5.2 2.1 6.2 5.2Z" />
                    <path d="M11.5 16c3.5-.2 5.8-2.4 6.2-5.2-2.9.2-5.2 2.1-6.2 5.2Z" />
                    <path d="M18.5 3.5l.6 1.5 1.5.6-1.5.6-.6 1.5-.6-1.5-1.5-.6 1.5-.6.6-1.5Z" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>구매후기</strong></span>
              </span>
            </button>
          </li>
        </ul>

        <div class="admin-nav-group-label">상점 설정</div>
        <ul class="admin-nav-list">
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="codes">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 한의원 약장 4칸 서랍 (분류 코드) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3.5" y="4" width="17" height="16" rx="2" />
                    <line x1="12" y1="4" x2="12" y2="20" />
                    <line x1="3.5" y1="12" x2="20.5" y2="12" />
                    <line x1="7" y1="8" x2="8.5" y2="8" />
                    <line x1="15.5" y1="8" x2="17" y2="8" />
                    <line x1="7" y1="16" x2="8.5" y2="16" />
                    <line x1="15.5" y1="16" x2="17" y2="16" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>분류 코드</strong></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="hero">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 전통 서원 솟을대문 (대문 관리) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.5 8.2C7 6.8 17 6.8 21.5 8.2" />
                    <line x1="4.5" y1="8.2" x2="4.5" y2="20" />
                    <line x1="19.5" y1="8.2" x2="19.5" y2="20" />
                    <rect x="7.5" y="10.8" width="9" height="9.2" rx="0.8" />
                    <line x1="12" y1="10.8" x2="12" y2="20" />
                    <circle cx="10.3" cy="15.2" r="0.6" fill="currentColor" />
                    <circle cx="13.7" cy="15.2" r="0.6" fill="currentColor" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>대문 관리</strong></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="banners">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 전통 서재 현판 (배너 관리) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="7.5" y1="3.5" x2="7.5" y2="7" />
                    <line x1="16.5" y1="3.5" x2="16.5" y2="7" />
                    <rect x="3" y="7" width="18" height="11.5" rx="2" />
                    <rect x="5.8" y="9.6" width="12.4" height="6.3" rx="0.8" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>배너 관리</strong></span>
              </span>
            </button>
          </li>
          <li>
            <button type="button" class="admin-nav-btn" data-admin-sec="settings">
              <span class="admin-nav-item-main">
                <span class="admin-nav-icon" aria-hidden="true">
                  <!-- 전통 낙관 인장 (기본 설정) -->
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="6.2" r="2.6" />
                    <path d="M9.8 8.6L8.5 14h7l-1.3-5.4" />
                    <rect x="5" y="14" width="14" height="3.5" rx="1.2" />
                    <line x1="6" y1="20.5" x2="18" y2="20.5" />
                  </svg>
                </span>
                <span class="admin-nav-btn-text"><strong>기본 설정</strong></span>
              </span>
            </button>
          </li>
        </ul>
      </div>

      <div class="admin-sidebar-foot">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div>
            <strong id="sidebarAdminName">출판부 총괄관리자</strong>
            <div style="font-size:0.72rem; opacity:0.78;">접속 중</div>
          </div>
          <a href="./admin-login.html" class="btn btn-sm btn-outline" style="min-height:32px; padding:0 10px; font-size:0.76rem;">로그아웃</a>
        </div>
      </div>
    </aside>

    <!-- 우측 작업 영역 -->
    <div class="admin-workspace">
      <header class="admin-topbar">
        <div class="admin-topbar-left">
          <button type="button" class="btn btn-sm btn-outline admin-mobile-menu-btn" id="btnOpenAdminDrawer">
            ☰ 메뉴
          </button>
          <a href="./admin.html" class="admin-topbar-logo" aria-label="현동서재 관리자 홈">
            <img src="./images/logo-mark.svg" alt="현동서재 관리자 로고" width="30" height="30" />
          </a>
          <h1 class="admin-page-title" id="adminPageTitle">대시보드</h1>
        </div>
        <div class="admin-topbar-right">
          <a href="./index.html" class="btn btn-sm btn-outline">쇼핑몰 보기 ↗</a>
          <a href="./admin-book-new.html" class="btn btn-sm btn-primary">+ 새 도서 등록</a>
        </div>
      </header>

      <main class="admin-content" id="adminMainContent"></main>
      <footer class="admin-footer">
        <span style="display:inline-flex; align-items:center; gap:8px;">
          <img src="./images/logo-mark.svg" alt="현동서재 로고" width="22" height="22" style="border-radius:5px; flex-shrink:0;" />
          <span>현동서재 운영 관리자 센터 · 도서출판 물고기 · 현동학당</span>
        </span>
        <span style="display:inline-flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <span>Copyright © <span class="js-current-year">2026</span> 현동서재. All rights reserved.</span>
          <button type="button" id="btnAdminResetDemo" style="background:none; border:none; padding:0; font-size:0.78rem; color:var(--color-text-muted); text-decoration:underline; cursor:pointer;">초기 데이터 복원</button>
        </span>
      </footer>
    </div>
  </div>

  <!-- 모바일 하단 빠른 이동 탭바 -->
  <nav class="admin-mobile-bottom-bar" aria-label="관리자 모바일 빠른 메뉴">
    <button type="button" class="admin-mob-tab is-active" data-admin-sec="dashboard">대시보드</button>
    <button type="button" class="admin-mob-tab" data-admin-sec="books">도서관리</button>
    <button type="button" class="admin-mob-tab" data-admin-sec="orders">주문·발송</button>
    <button type="button" class="admin-mob-tab" data-admin-sec="qna">문의답변</button>
    <button type="button" class="admin-mob-tab" id="btnMobMoreMenu">전체메뉴 ☰</button>
  </nav>

  <!-- 모달: 택배 송장번호 등록 모달 -->
  <div class="modal-backdrop" id="waybillModal" role="dialog" aria-modal="true" aria-labelledby="waybillModalTitle">
    <div class="modal-panel modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="waybillModalTitle">택배 송장번호 등록 · 발송 처리</h2>
        <button type="button" class="modal-close" data-close-admin-modal="waybillModal" aria-label="닫기">×</button>
      </div>
      <form id="waybillIssueForm">
        <div class="modal-body" id="waybillModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-admin-modal="waybillModal">닫기</button>
          <button type="submit" class="btn btn-primary">송장 등록 및 발송 완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 2: 로젠택배 송장번호 일괄 등록 모달 -->
  <div class="modal-backdrop" id="bulkWaybillModal" role="dialog" aria-modal="true" aria-labelledby="bulkWaybillModalTitle">
    <div class="modal-panel modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="bulkWaybillModalTitle">발송대기 주문 송장 일괄 등록</h2>
        <button type="button" class="modal-close" data-close-admin-modal="bulkWaybillModal" aria-label="닫기">×</button>
      </div>
      <form id="bulkWaybillForm">
        <div class="modal-body" id="bulkWaybillModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-admin-modal="bulkWaybillModal">취소</button>
          <button type="submit" class="btn btn-primary">일괄 송장 등록 및 발송완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 3: 회원 상세 정보 및 적립금/메모 관리 모달 -->
  <div class="modal-backdrop" id="memberDetailModal" role="dialog" aria-modal="true" aria-labelledby="memberDetailModalTitle">
    <div class="modal-panel modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="memberDetailModalTitle">회원 상세 정보 및 관리</h2>
        <button type="button" class="modal-close" data-close-admin-modal="memberDetailModal" aria-label="닫기">×</button>
      </div>
      <form id="memberEditForm">
        <div class="modal-body" id="memberDetailModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-admin-modal="memberDetailModal">닫기</button>
          <button type="submit" class="btn btn-primary">변경 내용 저장</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 4: 1:1 문의 답변 작성 모달 -->
  <div class="modal-backdrop" id="qnaReplyModal" role="dialog" aria-modal="true" aria-labelledby="qnaReplyModalTitle">
    <div class="modal-panel modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="qnaReplyModalTitle">1:1 고객 문의 답변하기</h2>
        <button type="button" class="modal-close" data-close-admin-modal="qnaReplyModal" aria-label="닫기">×</button>
      </div>
      <form id="qnaReplyForm">
        <div class="modal-body" id="qnaReplyModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-admin-modal="qnaReplyModal">취소</button>
          <button type="submit" class="btn btn-primary">답변 저장하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 모달 5: 공지사항 / 자주 묻는 질문(FAQ) 등록 및 수정 모달 -->
  <div class="modal-backdrop" id="boardPostModal" role="dialog" aria-modal="true" aria-labelledby="boardPostModalTitle">
    <div class="modal-panel modal-sm">
      <div class="modal-header">
        <h2 class="modal-title" id="boardPostModalTitle">게시글 작성 · 수정</h2>
        <button type="button" class="modal-close" data-close-admin-modal="boardPostModal" aria-label="닫기">×</button>
      </div>
      <form id="boardPostForm">
        <div class="modal-body" id="boardPostModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-close-admin-modal="boardPostModal">취소</button>
          <button type="submit" class="btn btn-primary" id="btnSubmitBoardPost">게시글 등록하기</button>
