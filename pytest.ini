[pytest]
testpaths = tests/e2e
norecursedirs = challenger_archives .git .agents node_modules
python_files = test_f*.py test_cross*.py
markers =
    tier1: Tier 1 primary acceptance tests
    tier2: Tier 2 edge cases and boundary conditions
    tier3: Tier 3 regression stress tests
    tier4: Tier 4 adversarial security and deep resilience tests
