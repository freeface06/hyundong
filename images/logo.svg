<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <linearGradient id="logoTaupe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#918a7d"/>
      <stop offset="100%" stop-color="#787165"/>
    </linearGradient>
    <linearGradient id="logoSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b3e35"/>
      <stop offset="100%" stop-color="#8c3a32"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2c2925" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Traditional Seal Stamp "玄同" -->
  <g transform="translate(6, 8)" filter="url(#logoShadow)">
    <rect width="64" height="64" rx="10" fill="url(#logoSeal)"/>
    <rect x="3" y="3" width="58" height="58" rx="8" fill="none" stroke="#f2efe9" stroke-width="1.8" stroke-opacity="0.9"/>
    <rect x="6" y="6" width="52" height="52" rx="6" fill="none" stroke="#f2efe9" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="32" y="31" font-family="'Noto Serif KR', 'Batang', serif" font-weight="900" font-size="22" fill="#fbf9f5" text-anchor="middle">玄</text>
    <text x="32" y="54" font-family="'Noto Serif KR', 'Batang', serif" font-weight="900" font-size="20" fill="#fbf9f5" text-anchor="middle">同</text>
  </g>

  <!-- Vertical Divider with #918a7d Accent -->
  <line x1="84" y1="14" x2="84" y2="66" stroke="#918a7d" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Right: Typography -->
  <g transform="translate(98, 0)">
    <!-- Main Title: 현동서재 玄同書齋 -->
    <text x="0" y="42" font-family="'Noto Serif KR', 'Batang', serif" font-weight="700" font-size="26" fill="#2c2925" letter-spacing="-0.03em">
      현동서재
      <tspan font-weight="500" font-size="20" fill="#5f594f" dx="8" font-family="'Noto Serif KR', 'Batang', serif">玄同書齋</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="62" font-family="'Pretendard', -apple-system, sans-serif" font-weight="500" font-size="12.5" fill="#787165" letter-spacing="-0.01em">
      현동학당 · 도서출판 물고기 공식 서점
    </text>
  </g>
</svg>